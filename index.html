<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주재명 사전</title>
<style>
  :root {
    --bg: #f7f3ea;
    --paper: #fffdf8;
    --ink: #2b2620;
    --sub: #7a7064;
    --line: #e4dccd;
    --accent: #b23a2b;
    --tag: #efe7d8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
    line-height: 1.6;
  }
  header {
    text-align: center;
    padding: 48px 16px 24px;
    border-bottom: 3px double var(--line);
  }
  header h1 {
    margin: 0;
    font-size: 2.6rem;
    letter-spacing: 0.2em;
  }
  header p { margin: 8px 0 0; color: var(--sub); }

  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 80px; }

  .search {
    width: 100%;
    padding: 14px 18px;
    font-size: 1.05rem;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--paper);
    outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .filters, .chosung {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px;
  }
  .chip {
    border: 1px solid var(--line);
    background: var(--paper);
    padding: 4px 12px;
    border-radius: 999px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.9rem;
    color: var(--ink);
  }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .chosung .chip { padding: 4px 10px; min-width: 34px; }
  .chip:disabled { opacity: 0.3; cursor: default; }

  .count { margin: 18px 0 8px; color: var(--sub); font-size: 0.9rem; }

  .entry {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 20px 22px;
    margin-bottom: 14px;
  }
  .entry-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .word { font-size: 1.5rem; font-weight: 700; margin: 0; }
  .pos { color: var(--accent); font-size: 0.9rem; }
  .level { margin-left: auto; font-size: 0.85rem; color: var(--sub); }
  .meaning { margin: 10px 0 0; font-size: 1.05rem; }
  .example {
    margin: 10px 0 0;
    padding-left: 12px;
    border-left: 3px solid var(--line);
    color: var(--sub);
    font-style: italic;
  }
  .meta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { background: var(--tag); padding: 2px 10px; border-radius: 6px; font-size: 0.8rem; }
  .warn { background: #f6d9d4; color: var(--accent); }
  .related { margin-top: 10px; font-size: 0.9rem; color: var(--sub); }
  .related a { color: var(--accent); cursor: pointer; text-decoration: underline; }

  .empty { text-align: center; color: var(--sub); padding: 40px 0; }
  footer { text-align: center; color: var(--sub); font-size: 0.85rem; padding: 20px; }
</style>
</head>
<body>

<header>
  <h1>주재명 사전</h1>
  <p>표준주재명국어대사전 · 제1판</p>
</header>

<div class="wrap">
  <input class="search" id="search" type="search" placeholder="단어나 뜻으로 검색 (초성 검색 가능: ㅈㅈㅁ)">
  <div class="filters" id="filters"></div>
  <div class="chosung" id="chosung"></div>
  <div class="count" id="count"></div>
  <div id="list"></div>
</div>

<footer>새 단어는 코드 맨 위 WORDS 목록에 추가하세요.</footer>

<script>
/* ================================================================
   ★ 단어 추가는 여기서만 하면 됩니다 ★
   아래 형식대로 { ... }, 하나를 복사해서 붙여넣고 내용만 바꾸세요.

   word     : 단어 (필수)
   meaning  : 뜻 (필수)
   pos      : 품사 (명사, 감탄사, 줄임말 등) - 없어도 됨
   example  : 예문 - 없어도 됨
   category : 분류 - 없어도 됨 (새 분류를 쓰면 필터 버튼이 자동으로 생김)
   level    : 위험도 1~5 (숫자) - 없어도 됨
   warn     : true 이면 "주의" 표시
   related  : 관련 단어 목록 ["단어1", "단어2"] - 클릭하면 그 단어로 이동
   ================================================================ */
const WORDS = [
  {
    word: "주재명",
    pos: "명사",
    meaning: "주재명. 또는 그러한 사람.",
    example: "저 사람 완전 주재명이네.",
    category: "기본",
    level: 3,
    related: ["ㅈㅈㅁ", "홀리 주재명"]
  },
  {
    word: "ㅈㅈㅁ",
    pos: "명사",
    meaning: "주재명을 초성으로 표현한 단어로, 주재명보다 약한 단어.",
    example: "에이, 그 정도면 ㅈㅈㅁ 수준이지.",
    category: "줄임말",
    level: 2,
    related: ["주재명"]
  },
  {
    word: "니여주",
    pos: "줄임말",
    meaning: "니 여친 주재명의 줄임말로, 매우 심한 모욕감을 줄 수 있음.",
    example: "야 그건 선 넘었지, 니여주.",
    category: "줄임말",
    level: 5,
    warn: true,
    related: ["주재명"]
  },
  {
    word: "홀리 주재명",
    pos: "감탄사",
    meaning: "매우 놀랍거나 신기할 때 쓰는 말.",
    example: "홀리 주재명! 이게 된다고?",
    category: "감탄사",
    level: 1,
    related: ["주재명"]
  },
  {
    word: "주숭이",
    pos: "명사",
    meaning: "주재명의 원숭이 버전. 또는 아이큐가 낮을 사람.",
    example: "우와! 야생의 주숭이다!",
    category: "명사",
    level: 20,
    related: ["주재명"]
  },


  // ↓ 여기에 새 단어 추가
  // {
  //   word: "새 단어",
  //   pos: "명사",
  //   meaning: "뜻을 적으세요.",
  //   example: "예문을 적으세요.",
  //   category: "기본",
  //   level: 1,
  //   related: []
  // },
];

/* ================================================================
   설정 (바꾸고 싶으면 여기)
   ================================================================ */
const CONFIG = {
  sortByWord: true,          // true: 가나다순 정렬 / false: 적은 순서대로
  levelIcon: "🔥",           // 위험도 표시 아이콘
  levelLabel: "위험도",
};

/* ================================================================
   아래부터는 건드리지 않아도 됩니다
   ================================================================ */
const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
const CHO_BUTTONS = ["ㄱ","ㄴ","ㄷ","ㄹ","ㅁ","ㅂ","ㅅ","ㅇ","ㅈ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ","기타"];
const MERGE = { "ㄲ":"ㄱ","ㄸ":"ㄷ","ㅃ":"ㅂ","ㅆ":"ㅅ","ㅉ":"ㅈ" };

// 글자 → 초성 문자열 (한글 아니면 그대로)
function toChosung(str) {
  let out = "";
  for (const ch of str) {
    const code = ch.charCodeAt(0) - 0xAC00;
    if (code >= 0 && code <= 11171) out += CHO[Math.floor(code / 588)];
    else out += ch;
  }
  return out;
}

// 단어의 첫 초성 (분류용)
function firstChosung(word) {
  const c = toChosung(word.trim()[0] || "");
  const m = MERGE[c] || c;
  return CHO_BUTTONS.includes(m) ? m : "기타";
}

const state = { query: "", category: "전체", cho: null };

const $ = id => document.getElementById(id);

function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function matches(w) {
  if (state.category !== "전체" && (w.category || "기타") !== state.category) return false;
  if (state.cho && firstChosung(w.word) !== state.cho) return false;
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  const hay = (w.word + " " + w.meaning + " " + (w.example || "")).toLowerCase();
  if (hay.includes(q)) return true;
  // 초성 검색: 단어의 초성에 검색어가 포함되면 통과
  return toChosung(w.word).includes(q);
}

function renderFilters() {
  const cats = ["전체", ...new Set(WORDS.map(w => w.category || "기타"))];
  $("filters").innerHTML = cats.map(c =>
    `<button class="chip ${c === state.category ? "on" : ""}" data-cat="${escapeHTML(c)}">${escapeHTML(c)}</button>`
  ).join("");

  const used = new Set(WORDS.map(w => firstChosung(w.word)));
  $("chosung").innerHTML = CHO_BUTTONS.map(c =>
    `<button class="chip ${c === state.cho ? "on" : ""}" data-cho="${c}" ${used.has(c) ? "" : "disabled"}>${c}</button>`
  ).join("");
}

function renderEntry(w) {
  const level = w.level ? `<span class="level">${CONFIG.levelLabel} ${CONFIG.levelIcon.repeat(Math.min(5, w.level))}</span>` : "";
  const example = w.example ? `<p class="example">${escapeHTML(w.example)}</p>` : "";
  const tags = [
    w.category ? `<span class="tag">${escapeHTML(w.category)}</span>` : "",
    w.warn ? `<span class="tag warn">⚠ 사용 주의</span>` : ""
  ].join("");
  const related = (w.related && w.related.length)
    ? `<div class="related">관련어: ${w.related.map(r => `<a data-go="${escapeHTML(r)}">${escapeHTML(r)}</a>`).join(", ")}</div>`
    : "";
  return `
    <article class="entry" id="w-${encodeURIComponent(w.word)}">
      <div class="entry-head">
        <h2 class="word">${escapeHTML(w.word)}</h2>
        ${w.pos ? `<span class="pos">「${escapeHTML(w.pos)}」</span>` : ""}
        ${level}
      </div>
      <p class="meaning">${escapeHTML(w.meaning)}</p>
      ${example}
      ${tags ? `<div class="meta">${tags}</div>` : ""}
      ${related}
    </article>`;
}

function render() {
  renderFilters();
  let list = WORDS.filter(matches);
  if (CONFIG.sortByWord) list = [...list].sort((a, b) => a.word.localeCompare(b.word, "ko"));
  $("count").textContent = `총 ${WORDS.length}개 중 ${list.length}개 표시`;
  $("list").innerHTML = list.length
    ? list.map(renderEntry).join("")
    : `<div class="empty">찾는 단어가 없습니다. 아직 주재명화되지 않은 말인 듯합니다.</div>`;
}

$("search").addEventListener("input", e => { state.query = e.target.value; render(); });

document.addEventListener("click", e => {
  const t = e.target;
  if (t.dataset.cat) { state.category = t.dataset.cat; render(); }
  if (t.dataset.cho) { state.cho = state.cho === t.dataset.cho ? null : t.dataset.cho; render(); }
  if (t.dataset.go) {
    state.query = ""; state.category = "전체"; state.cho = null;
    $("search").value = "";
    render();
    const el = document.getElementById("w-" + encodeURIComponent(t.dataset.go));
    if (el) {
      el.scrollIntoView({ behavior: "smooth", block: "center" });
      el.style.outline = "2px solid var(--accent)";
      setTimeout(() => el.style.outline = "", 1200);
    }
  }
});

render();
</script>
</body>
</html>
